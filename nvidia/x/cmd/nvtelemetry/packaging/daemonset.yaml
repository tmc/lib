apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvtelemetry-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: nvtelemetry
    app.kubernetes.io/part-of: nvidia-telemetry
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvtelemetry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvtelemetry
      annotations:
        nvidia.com/nvtelemetry-probe-strategy: nvtelemetry-authenticated-exec-v1
    spec:
      # This template requires a cluster-registered NVIDIA runtime class that
      # injects the host NVML library and all visible NVIDIA device nodes.
      # Clusters without that runtime/device injection are unsupported here.
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nvtelemetry
          # Replace with an immutable image reference pinned by digest before use.
          image: "REQUIRED_IMAGE_DIGEST"
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/nvtelemetry
            - serve
            - -config
            - /etc/nvtelemetry/config.json
          env:
            # This controls runtime visibility only. config.json device_uuids
            # separately selects the GPUs that the agent actually samples.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/nvtelemetry
                - probe
                - -kind=liveness
                - -config=/etc/nvtelemetry/config.json
                - -ca-file=/run/nvtelemetry/credentials/ca.crt
                - -server-name=REQUIRED_TLS_SERVER_NAME
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/nvtelemetry
                - probe
                - -kind=readiness
                - -config=/etc/nvtelemetry/config.json
                - -ca-file=/run/nvtelemetry/credentials/ca.crt
                - -server-name=REQUIRED_TLS_SERVER_NAME
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nvtelemetry
              readOnly: true
            - name: serving-credentials
              mountPath: /run/nvtelemetry/credentials
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: nvtelemetry-config
        - name: serving-credentials
          secret:
            secretName: nvtelemetry-serving-credentials
            defaultMode: 0440
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
