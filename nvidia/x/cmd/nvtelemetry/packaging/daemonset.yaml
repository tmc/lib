apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvtelemetry-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: nvtelemetry
    app.kubernetes.io/part-of: nvidia-telemetry
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvtelemetry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvtelemetry
    spec:
      # Run as non-root user: NVML reads telemetry via /dev/nvidia* character devices
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: nvtelemetry
          image: ghcr.io/tmc/nvtelemetry:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/nvtelemetry
            - serve
            - -config
            - /etc/nvtelemetry/config.json
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # Optional CAP_PERFMON for restricted host counter policies (Linux 5.8+).
              # Neither CAP_PERFMON nor elevated privileges are proven or required for mock/NVML;
              # native hardware capability qualification remains pending.
              add:
                - CAP_PERFMON
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          # Liveness probe: verifies agent process and lifecycle loop are alive
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9464
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness probe: verifies fresh unexpired GPU telemetry snapshot is available
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9464
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nvtelemetry
              readOnly: true
            - name: dev-nvidia
              mountPath: /dev
      volumes:
        - name: config-volume
          configMap:
            name: nvtelemetry-config
        - name: dev-nvidia
          hostPath:
            path: /dev
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
